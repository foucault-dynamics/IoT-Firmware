; PlatformIO build for the gateway.
;
; PlatformIO supplies ESP-IDF itself: the espressif32 platform pulls in the
; framework-espidf package and sets IDF_PATH for the build, so no standalone
; ESP-IDF install is needed. The platform version is pinned below so every
; checkout builds against the same ESP-IDF release, rather than whichever one is
; current when the platform first gets installed.
;
; src_dir points at main/ so PlatformIO adopts ESP-IDF's own project layout
; instead of its default src/. The build then runs from the stock CMakeLists.txt
; in this directory, which pulls the shared components in from ../../components
; via EXTRA_COMPONENT_DIRS. The esp-mqtt dependency is declared in
; main/idf_component.yml and fetched by the IDF component manager into
; managed_components/ in this directory, with the resolved versions recorded in
; dependencies.lock. Build options, including the larger app partition this
; firmware needs, come from sdkconfig.defaults.

[platformio]
src_dir = main

; platformio/espressif32@7.0.1 ships ESP-IDF v6.0.1.
[env:gateway]
platform = platformio/espressif32@7.0.1
framework = espidf
board = esp32dev
monitor_speed = 115200

; PlatformIO builds the partition image it flashes from this CSV, not from the
; CONFIG_PARTITION_TABLE_* choice in sdkconfig.defaults. Both are set to the
; same 1500K app partition; if you change one, change the other.
board_build.partitions = partitions_singleapp_large.csv
