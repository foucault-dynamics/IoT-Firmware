; Fake IR meter for a second board with an IR head (PiggyMeter), so the IR
; node can be tested over real light. Its own project, so the firmware's envs
; never build it.
;
;   pio run -e s2_mini -t upload -t monitor      (from this folder)
;
; s2_mini: Lolin S2 Mini, wired like the EE team's IR_probe_signal_testing rig.
; c3:      ESP32-C3 SuperMini, wired like the base PCB.

[platformio]
default_envs = s2_mini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:s2_mini]
board = lolin_s2_mini
; The S2's own USB drops out mid-upload at full speed
upload_speed = 115200
; Flash from download mode (hold 0 while plugging in). The 1200 baud reset
; trick knocks the board back out of it.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
build_flags =
	-D METER_RX_PIN=11
	-D METER_TX_PIN=12

[env:c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D METER_RX_PIN=20
	-D METER_TX_PIN=21
